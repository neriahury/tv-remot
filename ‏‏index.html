<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grandma Remote</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    button { font-size: 24px; padding: 15px 40px; margin: 10px; }
  </style>
</head>
<body>
  <h1>ESP32 LED Test</h1>
  <p id="status">Connecting...</p>
  <button onclick="send('on')">LED On</button>
  <button onclick="send('off')">LED Off</button>

  <script>
    const topic = "neriya-x7k2/grandma/led";
    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

    client.on("connect", () => {
      document.getElementById("status").innerText = "Connected";
    });
    client.on("error", () => {
      document.getElementById("status").innerText = "Connection error";
    });

    function send(msg) {
      client.publish(topic, msg);
      document.getElementById("status").innerText = "Sent: " + msg;
    }
  </script>
</body>
</html>
